[workspace]
resolver = "2"
members = [
    "crates/ob",
    "crates/micro",
    "crates/models",
    "crates/perps",
    "crates/vol",
    "crates/feed",
    "crates/engine",
    "crates/bench",
    "crates/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/idrees2516/perp-options-clob"

[workspace.lints.clippy]
# Indexed loops read clearer in the numerical kernels (FFT/DCT matrices,
# HJB grids, tree recurrences); math APIs need their parameter counts;
# test setups intentionally mutate Default configs field-by-field.
needless_range_loop = "allow"
too_many_arguments = "allow"
field_reassign_with_default = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"

[profile.test]
opt-level = 1
